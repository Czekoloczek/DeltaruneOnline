name: DeepSeek full review (one-off)

# Jednorazowo: powtórka części 1 (GML) i 2 (native/) przeglądu całego repo, które w przebiegu 45180652807
# wróciły puste. Uruchamia się na pushu, który dodaje ten plik; następny commit go usuwa.
on:
  push:
    branches: [claude/project-thread-53x0yb]
    paths: [.github/workflows/deepseek-full-review-once.yml]

permissions: {}

jobs:
  review:
    if: contains(fromJSON('["PolskiKapsel", "Czekoloczek"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Przegląd DeepSeek części 1 i 2 (Flash, reasoning max)
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SCOPE: repo
          PARTS: "1,2"
          INPUT_MODEL: deepseek-flash
          INPUT_REASONING: max
          REQUESTER: ${{ github.triggering_actor }}
        run: python3 -I tools/deepseek_review.py
