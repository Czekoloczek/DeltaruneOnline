name: Testy

# Testy bez gry: reguły patchera i spójność plików (Python, sama biblioteka standardowa) oraz lockstep
# i Agent API drnet.dll pod Wine i na Windowsie. Testy wymagające plików gry i moda (tools/headless_test.sh, nagrywanie i odtwarzanie,
# test w walce) zostają lokalne, bo tych plików nie wolno trzymać w repo ani w CI.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patcher:
    name: Patcher i spójność plików
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Testy (python3 -m unittest)
        run: python3 -m unittest discover -s tests -v

  drnet:
    name: drnet.dll pod Wine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: mingw-w64 i Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 wine wine64
      - name: Budowa drnet.dll, test_drnet.exe i test_agent.exe
        run: sh native/build.sh
      # Każda strona liczy sumę kontrolną wszystkich wejść, które dostała; muszą być identyczne.
      # Czasów klatek tu nie sprawdzamy: na maszynach GitHuba są zbyt nierówne.
      - name: Host i klienci dostają identyczne wejście
        run: |
          export WINE="$(command -v wine || command -v wine64)"
          sh native/test_pair.sh 0 450 2
          sh native/test_pair.sh 30 450 2
          sh native/test_pair.sh 60 450 2
          sh native/test_pair.sh 0 450 3
          # trzeci gracz dołącza 12 s później: pozostali czekają na niego, zamiast odpaść po 10 s
          sh native/test_pair.sh 0 150 3 12
          sh native/test_handshake.sh
      # Udawana gra ładuje drnet.dll i woła ją tak jak GML, a skrypt rozmawia z nią jak agent: protokół, limity,
      # błędne komendy, moment odpowiedzi "done" przy opóźnieniu wejścia. Sam GML (stan gry) wymaga gry.
      - name: Agent API bez gry
        run: |
          export WINE="$(command -v wine || command -v wine64)"
          python3 native/test_agent.py

  # To samo na prawdziwym Windowsie: prawdziwy Winsock i ładowanie DLL zamiast ich odpowiedników z Wine.
  # Gracze na Windowsie uruchamiają grę dokładnie tak. Na prywatnym repo minuty Windowsa liczą się podwójnie.
  drnet-windows:
    name: drnet.dll na Windowsie
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Budowa drnet.dll, test_drnet.exe i test_agent.exe (mingw-w64 z obrazu GitHuba)
        run: |
          [ -x /c/mingw64/bin/gcc.exe ] && export PATH="/c/mingw64/bin:$PATH"
          export CC="$(command -v x86_64-w64-mingw32-gcc || command -v gcc)"
          "$CC" --version | head -1
          sh native/build.sh
      - name: Host i klienci dostają identyczne wejście
        run: |
          sh native/test_pair.sh 0 450 2
          sh native/test_pair.sh 30 450 2
          sh native/test_pair.sh 60 450 2
          sh native/test_pair.sh 0 450 3
          sh native/test_pair.sh 0 150 3 12
          sh native/test_handshake.sh
      - name: Agent API bez gry
        run: |
          PY="$(PYTHON=python sh tools/find_python.sh)"
          "$PY" native/test_agent.py
