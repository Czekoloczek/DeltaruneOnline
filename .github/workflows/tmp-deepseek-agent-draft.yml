name: Temporary DeepSeek agent API draft

# TEMPORARY, removed in the next commit: runs .github/deepseek-draft/generate.py once, because
# DEEPSEEK_API_KEY exists only as an Actions secret, and commits DeepSeek's raw answer back to this branch.

on:
  push:
    branches: [claude/project-thread-xp637s]
    paths:
      - .github/workflows/tmp-deepseek-agent-draft.yml
      - .github/deepseek-draft/generate.py
      - docs/agent-api-spec.md

concurrency:
  group: tmp-deepseek-agent-draft
  cancel-in-progress: false

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write   # commit the answer back to this branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Ask DeepSeek V4 Pro
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 -I .github/deepseek-draft/generate.py

      - name: Commit the raw answer
        if: always()
        run: |
          ls -la .github/deepseek-draft/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/deepseek-draft/answer.md .github/deepseek-draft/reasoning.md .github/deepseek-draft/meta.json || true
          git commit -m "DeepSeek V4 Pro answer to docs/agent-api-spec.md (raw, unedited)" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
